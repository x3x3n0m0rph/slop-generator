parallelism: 2
python: python

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4.1-mini
    api_key: REPLACE_WITH_OPENROUTER_KEY
    # Optional: remove this setting for a direct connection.
    socks5: socks5://user:password@127.0.0.1:1080
    max_tokens: 4096
    timeout_seconds: 120

repositories:
  playground:
    path: ../playground
    remote: origin
    branch: main
    output_dir: generated
    pull_after_push: true
    # Defaults to the source repository's Git identity.
    # author_name: Slop Generator
    # author_email: slop@example.com

pipelines:
  python-functions:
    type: python
    instruction: Implement the requested short Python function. Use the standard library only.
    jobs:
      - id: insertion-sort
        instruction: Implement insertion_sort(values), returning a sorted copy of the input list without using sorted() or list.sort().
      - id: read-lines
        instruction: Implement read_lines(path), reading a UTF-8 file and returning its lines without trailing newline characters.
      - id: quadratic
        instruction: Implement real_roots(a, b, c) for a quadratic equation, returning a sorted list of unique real roots. Handle linear and degenerate cases explicitly.
  short-texts:
    type: text
    instruction: Write clear, concise text addressing the requested topic.
    jobs:
      - id: sorting-guide
        extension: .md
        instruction: Write a short Markdown explanation of insertion sort, including its complexity and a worked example.
      - id: file-reading
        extension: .txt
        instruction: Explain UTF-8 text file reading and newline handling in Python in three short paragraphs.
