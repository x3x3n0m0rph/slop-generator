parallelism: 2

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4.1-mini
    api_key: REPLACE_WITH_OPENROUTER_KEY
    # Optional: remove this setting for a direct connection.
    socks5: socks5://user:password@127.0.0.1:1080
    max_tokens: 4096
    timeout_seconds: 120

repositories:
  playground:
    path: ../playground
    remote: origin
    branch: main
    output_dir: generated
    pull_after_push: true
    # Defaults to the source repository's Git identity.
    # author_name: Slop Generator
    # author_email: slop@example.com

# Stage order and types are defined in Go. These settings configure instances.
# Omit filename/instruction to have the task wizard request them.
pipelines:
  python-functions:
    definition: python-functions
    config:
      max_retries: 3
      commit_mode: pipeline
    stages:
      insertion-sort.generate:
        filename: insertion-sort.py
        system_instruction: Use the Python standard library only.
        instruction: Implement insertion_sort(values), returning a sorted copy without sorted() or list.sort().
      insertion-sort.validate:
        python: python
      read-lines.generate:
        filename: read-lines.py
        instruction: Implement read_lines(path), reading UTF-8 lines without trailing newline characters.
      quadratic.generate:
        filename: quadratic.py
        instruction: Implement real_roots(a, b, c), returning sorted unique real roots; handle linear and degenerate cases.
  short-texts:
    definition: short-texts
    config:
      max_retries: 3
      commit_mode: pipeline
    stages:
      sorting-guide.generate:
        filename: sorting-guide.md
        instruction: Explain insertion sort, its complexity, and a worked example in Markdown.
      file-reading.generate:
        filename: file-reading.txt
        instruction: Explain UTF-8 file reading and newline handling in Python in three short paragraphs.
  documentation-generation:
    definition: documentation
    config:
      max_retries: 3
      commit_mode: pipeline
    stages:
      file-read:
        extension: .go
      inference:
        language: English
